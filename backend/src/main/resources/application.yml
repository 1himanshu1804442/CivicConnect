server:
  port: 8080

spring:
  application:
    name: civic-connect-backend

  # Defaults to embedded H2 in PostgreSQL compatibility mode for instant local testing,
  # or switches to production PostgreSQL when SPRING_DATASOURCE_URL is supplied.
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:civicconnect;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: ${HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}
        format_sql: true
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: 86400000

logging:
  level:
    com.civicconnect: INFO
    org.springframework.web: INFO
    org.springframework.security: INFO
