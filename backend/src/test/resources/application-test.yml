server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:mem:civicconnect_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
    show-sql: false
  h2:
    console:
      enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: 86400000

logging:
  level:
    com.civicconnect: DEBUG
    org.springframework.web: INFO
    org.springframework.security: INFO
